services:
  kafka:
    image: apache/kafka:3.7.2
    container_name: fraud_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  kafka-init:
    image: apache/kafka:3.7.2
    container_name: fraud_kafka_init
    depends_on:
      - kafka
    command: >
      bash -c "
      sleep 15 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic scores --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "

  postgres:
    image: postgres:16
    container_name: fraud_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
    volumes:
      - ./init_db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  scoring_service:
    build: .
    container_name: fraud_scoring_service
    depends_on:
      - kafka
      - kafka-init
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSACTIONS_TOPIC: transactions
      SCORES_TOPIC: scores
      MODEL_PATH: models/model.cbm
      THRESHOLD_PATH: models/threshold.json
    command: uv run python -m scoring_service.consumer_producer

  postgres_writer:
    build: .
    container_name: fraud_postgres_writer
    depends_on:
      - kafka
      - kafka-init
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCORES_TOPIC: scores
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
    command: uv run python -m postgres_writer.writer

  grafana:
    image: grafana/grafana:11.3.0
    container_name: fraud_grafana
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

  streamlit_app:
    build: .
    container_name: fraud_streamlit_app
    depends_on:
      - kafka
      - kafka-init
      - postgres
      - scoring_service
      - postgres_writer
    ports:
      - "8501:8501"
    volumes:
      - ./input:/app/input
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSACTIONS_TOPIC: transactions
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
    command: uv run streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  postgres_data:
  grafana_data: